<svg width="772" height="250" viewBox="0 0 772 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bricks Static — a plugin by BRXProd">
  <!--
    Banner FOREGROUND: a left-weighted dark shade + text + the logo pill, on a
    transparent base. scripts/render-assets.mjs composites this over the
    darkened dashboard screenshot and drops the BRXProd logo onto the pill.
  -->
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="772" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0822" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#0b0822" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#140d36" stop-opacity="0.46"/>
    </linearGradient>
  </defs>

  <rect width="772" height="250" fill="url(#shade)"/>

  <text x="52" y="92" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Bricks Static</text>
  <text x="54" y="130" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.92">Fast static sites from Bricks — no CMS, no database.</text>

  <text x="54" y="182" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.85">Another plugin by</text>
  <rect x="52" y="192" width="142" height="52" rx="11" fill="#ffffff"/>
</svg>
